<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | SentimentAI</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Segoe UI", Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #070b16;
            color: white;
            padding: 25px;
        }

        body::before {
            content: "";
            position: fixed;
            width: 450px;
            height: 450px;
            background: #6c5ce7;
            filter: blur(170px);
            opacity: 0.18;
            top: -180px;
            left: -150px;
        }

        body::after {
            content: "";
            position: fixed;
            width: 450px;
            height: 450px;
            background: #00cec9;
            filter: blur(170px);
            opacity: 0.12;
            bottom: -200px;
            right: -150px;
        }

        .container {
            width: 100%;
            max-width: 460px;
            position: relative;
            z-index: 2;
        }

        .logo {
            text-align: center;
            font-size: 28px;
            font-weight: 800;
            margin-bottom: 25px;
        }

        .logo span {
            color: #6c5ce7;
        }

        .login-card {
            padding: 42px;
            border-radius: 25px;
            background: rgba(255,255,255,0.055);
            border: 1px solid rgba(255,255,255,0.12);
            backdrop-filter: blur(25px);
            box-shadow: 0 30px 80px rgba(0,0,0,0.4);
        }

        .login-card h1 {
            font-size: 32px;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #929aae;
            margin-bottom: 30px;
            line-height: 1.6;
        }

        .input-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #dfe6e9;
            font-size: 14px;
            font-weight: 600;
        }

        input {
            width: 100%;
            padding: 15px 16px;
            border-radius: 12px;
            outline: none;
            border: 1px solid rgba(255,255,255,0.12);
            background: rgba(0,0,0,0.18);
            color: white;
            font-size: 15px;
            transition: 0.3s;
        }

        input::placeholder {
            color: #687185;
        }

        input:focus {
            border-color: #6c5ce7;
            box-shadow: 0 0 0 3px rgba(108,92,231,0.12);
        }

        button {
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 12px;
            color: white;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            background: linear-gradient(135deg, #6c5ce7, #8e7dff);
            box-shadow: 0 12px 30px rgba(108,92,231,0.3);
            transition: 0.3s;
            margin-top: 5px;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 17px 35px rgba(108,92,231,0.4);
        }

        .back {
            text-align: center;
            margin-top: 25px;
        }

        .back a {
            color: #a99cff;
            text-decoration: none;
        }

        .secure {
            text-align: center;
            margin-top: 25px;
            font-size: 13px;
            color: #687185;
        }

        .flash {
            padding: 12px;
            border-radius: 10px;
            margin-bottom: 18px;
            background: rgba(255,118,117,0.1);
            border: 1px solid rgba(255,118,117,0.2);
            color: #ff7675;
            font-size: 14px;
        }

        @media(max-width: 500px) {
            .login-card {
                padding: 28px 22px;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <div class="logo">
        Sentiment<span>AI</span>
    </div>

    <div class="login-card">

        <h1>Welcome Back 👋</h1>

        <p class="subtitle">
            Login to access the AI-powered IMDB review analyzer.
        </p>

        {% with messages = get_flashed_messages() %}
            {% if messages %}
                {% for message in messages %}
                    <div class="flash">
                        {{ message }}
                    </div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <form action="{{ url_for('login') }}" method="POST">

            <div class="input-group">
                <label>Your Name</label>

                <input
                    type="text"
                    name="name"
                    placeholder="Enter your full name"
                    required
                >
            </div>

            <div class="input-group">
                <label>Email Address</label>

                <input
                    type="email"
                    name="email"
                    placeholder="Enter your email"
                    required
                >
            </div>

            <div class="input-group">
                <label>Password</label>

                <input
                    type="password"
                    name="password"
                    placeholder="Enter your password"
                    required
                >
            </div>

            <button type="submit">
                Login to SentimentAI →
            </button>

        </form>

        <div class="back">
            <a href="{{ url_for('home') }}">
                ← Back to Home
            </a>
        </div>

        <div class="secure">
            🔒 Your session is securely protected
        </div>

    </div>

</div>

</body>
</html>
